# EcoShield AI — Locked Submission Frontend
[theme]
base = "light"
primaryColor = "#12B76A"
backgroundColor = "#F7FAF8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#173326"
linkColor = "#087A52"
borderColor = "#DCEAE2"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400

[server]
headless = true
runOnSave = true
fileWatcherType = "none"
maxUploadSize = 10
maxMessageSize = 50

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
